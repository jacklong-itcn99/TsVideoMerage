# 一次打 v* 标签,自动构建 Windows / macOS / Linux 三端包,并创建 GitHub Release。
# 也可在 Actions 页面手动运行(workflow_dispatch)只出三端产物、不发 Release。
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 需要写权限

jobs:
  # ---------- Windows:在 Linux 上用 mingw 交叉编译 ----------
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 mingw 交叉编译器
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 交叉编译 tsmerge.exe
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -ldflags "-H windowsgui -s -w" -o tsmerge-windows-amd64.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tsmerge-windows-amd64.exe

  # ---------- macOS:通用二进制 + .app,打包成 .dmg ----------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 编译通用二进制(arm64 + amd64)
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o tsmerge-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o tsmerge-amd64 .
          lipo -create -output tsmerge tsmerge-arm64 tsmerge-amd64
          file tsmerge
      - name: 打包 .app
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os darwin \
            --name TSMerge --app-id com.example.tsmerge \
            --icon icon.png --executable tsmerge
      - name: 制作 .dmg(带拖到 Applications 的布局)
        run: |
          mkdir -p dmg-stage
          cp -R TSMerge.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname TSMerge -srcfolder dmg-stage \
            -ov -format UDZO TSMerge-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TSMerge-macos-universal.dmg

  # ---------- Linux:CGO 原生编译,fyne 打包成 tar.xz ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 GUI 依赖
        # glfw 3.4 在 Linux 上同时编译 X11 + Wayland 后端,两套 dev 头文件都要
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: fyne 打包 Linux
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os linux \
            --name TSMerge --app-id com.example.tsmerge --icon icon.png
          mv ./*.tar.xz tsmerge-linux-amd64.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tsmerge-linux-amd64.tar.xz

  # ---------- 汇总三端产物,创建 Release(仅打标签时)----------
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出待发布产物
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            TS 视频合并工具 ${{ github.ref_name }}

            | 平台 | 文件 |
            |---|---|
            | Windows 64 位 | `tsmerge-windows-amd64.exe` |
            | macOS(Intel + Apple Silicon) | `TSMerge-macos-universal.dmg` |
            | Linux 64 位 | `tsmerge-linux-amd64.tar.xz` |

            macOS 未签名,首次打开右键→打开,或 `xattr -cr TSMerge.app`。
