# 在 GitHub 云端的 macOS 机器上构建 mac 版(无需自己有 Mac)。
# 触发方式:手动运行(Actions 页面点 Run workflow),或推送 v* 标签。
# 前提:本仓库根目录就是 tsmerge 模块(go.mod 在根目录)。
name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon 运行器,带 Xcode + macOS SDK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: 编译通用二进制(arm64 + amd64)
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o tsmerge-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o tsmerge-amd64 .
          lipo -create -output tsmerge tsmerge-arm64 tsmerge-amd64
          file tsmerge

      - name: 打包 .app
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os darwin \
            --name TSMerge \
            --app-id com.example.tsmerge \
            --icon icon.png \
            --executable tsmerge

      - name: 压缩 .app 以便下载
        run: zip -r -y TSMerge-macos.zip TSMerge.app

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TSMerge-macos
          path: TSMerge-macos.zip
