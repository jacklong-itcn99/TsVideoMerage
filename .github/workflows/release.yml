# 一次打 v* 标签,自动构建 Windows / macOS / Linux 三端包,并创建 GitHub Release。
# 三端都内置一个"极简 ffmpeg"(从官方源码现编,只保留 TS→MP4 无损转封装所需,约 2MB,LGPL)。
# 每个能执行的平台打包前用 testdata/sample.ts 做真实转封装冒烟测试,坏了就让构建失败。
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ---------- Windows:mingw 交叉编译,ffmpeg 编入单文件 exe ----------
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 编译极简 ffmpeg(Windows)
        run: bash scripts/build-min-ffmpeg.sh windows ffmpeg.exe
      - name: 内置 ffmpeg 并编译成单文件 exe
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          mkdir -p merger/ffmpeg-bin
          gzip -c ffmpeg.exe > merger/ffmpeg-bin/ffmpeg.exe.gz
          go build -tags embedffmpeg -ldflags "-H windowsgui -s -w" -o tsmerge-windows-amd64.exe .
          ls -lh tsmerge-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tsmerge-windows-amd64.exe
          retention-days: 1

  # ---------- macOS:通用二进制 + 通用极简 ffmpeg 装进 .app,打成 .dmg ----------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 编译通用二进制(arm64 + amd64)
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o tsmerge-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o tsmerge-amd64 .
          lipo -create -output tsmerge tsmerge-arm64 tsmerge-amd64
      - name: 编译极简 ffmpeg(通用)
        run: |
          bash scripts/build-min-ffmpeg.sh macos-arm64 ffmpeg-arm64
          bash scripts/build-min-ffmpeg.sh macos-x64   ffmpeg-x64
          lipo -create -output ffmpeg ffmpeg-arm64 ffmpeg-x64
          chmod +x ffmpeg
          file ffmpeg
      - name: 冒烟测试(内置 ffmpeg 必须能转封装)
        run: |
          ./ffmpeg -y -i testdata/sample.ts -c copy -movflags +faststart smoke.mp4 -loglevel error
          test -s smoke.mp4 && echo "✓ mac 极简 ffmpeg 可转封装"
      - name: 打包 .app(内置 ffmpeg)
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os darwin \
            --name TSMerge --app-id com.example.tsmerge \
            --icon icon.png --executable tsmerge
          cp ffmpeg TSMerge.app/Contents/MacOS/ffmpeg
          cp THIRD-PARTY-ffmpeg.txt TSMerge.app/Contents/Resources/
      - name: 制作 .dmg
        run: |
          mkdir -p dmg-stage
          cp -R TSMerge.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname TSMerge -srcfolder dmg-stage \
            -ov -format UDZO TSMerge-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TSMerge-macos-universal.dmg
          retention-days: 1

  # ---------- Linux:CGO 原生编译,极简 ffmpeg 注入 tar ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 GUI 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: 编译极简 ffmpeg 并冒烟测试
        run: |
          bash scripts/build-min-ffmpeg.sh linux ffmpeg
          ./ffmpeg -y -i testdata/sample.ts -c copy -movflags +faststart smoke.mp4 -loglevel error
          test -s smoke.mp4 && echo "✓ linux 极简 ffmpeg 可转封装"
      - name: fyne 打包并注入 ffmpeg
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os linux \
            --name TSMerge --app-id com.example.tsmerge --icon icon.png
          mkdir extract && tar xJf ./*.tar.xz -C extract
          TOP=$(ls extract)
          cp ffmpeg "extract/$TOP/usr/local/bin/ffmpeg"
          cp THIRD-PARTY-ffmpeg.txt "extract/$TOP/"
          tar cJf tsmerge-linux-amd64.tar.xz -C extract "$TOP"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tsmerge-linux-amd64.tar.xz
          retention-days: 1

  # ---------- 汇总三端产物,创建 Release(仅打标签时)----------
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出待发布产物
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            TS 视频合并工具 ${{ github.ref_name }} —— 三端均已内置 ffmpeg,开箱即可转 mp4,无需另装。

            | 平台 | 文件 |
            |---|---|
            | Windows 64 位 | `tsmerge-windows-amd64.exe`(单文件,已内置 ffmpeg,双击即用) |
            | macOS(Intel + Apple Silicon) | `TSMerge-macos-universal.dmg` |
            | Linux 64 位 | `tsmerge-linux-amd64.tar.xz` |

            macOS 未签名,首次打开右键→打开,或 `xattr -cr TSMerge.app`。
            内置的是从源码现编的极简 ffmpeg(约 2MB,LGPL,仅保留无损转封装);详见 `THIRD-PARTY-ffmpeg.txt`。
