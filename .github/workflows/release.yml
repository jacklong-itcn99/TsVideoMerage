# 一次打 v* 标签,自动构建 Windows / macOS / Linux 三端包(均内置 ffmpeg),并创建 GitHub Release。
# 也可在 Actions 页面手动运行(workflow_dispatch)只出三端产物、不发 Release。
#
# ffmpeg 来源:Windows/Linux 用 BtbN 静态构建;macOS 用 ffmpeg-static(BtbN 无 mac)。
# 每个能执行的平台都在打包前做冒烟测试:内置 ffmpeg 必须能真跑转封装,否则构建失败。
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BTBN_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  FFSTATIC_BASE: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1

jobs:
  # ---------- Windows:mingw 交叉编译,内置 BtbN ffmpeg,打成 zip ----------
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 mingw 交叉编译器
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: 交叉编译 tsmerge.exe
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -ldflags "-H windowsgui -s -w" -o tsmerge.exe .
      - name: 取 ffmpeg.exe 并打包
        run: |
          curl -fL -o ff.zip "${BTBN_BASE}/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ff.zip
          FF=$(find . -name ffmpeg.exe -path "*/bin/*" | head -1)
          mkdir -p tsmerge-windows-amd64
          cp tsmerge.exe "$FF" THIRD-PARTY-ffmpeg.txt tsmerge-windows-amd64/
          zip -r tsmerge-windows-amd64.zip tsmerge-windows-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tsmerge-windows-amd64.zip

  # ---------- macOS:通用二进制 + 通用 ffmpeg 装进 .app,打成 .dmg ----------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 编译通用二进制(arm64 + amd64)
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "-s -w" -o tsmerge-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "-s -w" -o tsmerge-amd64 .
          lipo -create -output tsmerge tsmerge-arm64 tsmerge-amd64
      - name: 下载并合成通用 ffmpeg
        run: |
          curl -fL -o ff-arm64 "${FFSTATIC_BASE}/ffmpeg-darwin-arm64"
          curl -fL -o ff-x64   "${FFSTATIC_BASE}/ffmpeg-darwin-x64"
          lipo -create -output ffmpeg ff-arm64 ff-x64
          chmod +x ffmpeg
          file ffmpeg
      - name: 冒烟测试内置 ffmpeg(转封装必须成功)
        run: |
          ./ffmpeg -y -f lavfi -i testsrc=duration=1:size=160x120:rate=10 -f mpegts smoke.ts -loglevel error
          ./ffmpeg -y -i smoke.ts -c copy -movflags +faststart smoke.mp4 -loglevel error
          test -s smoke.mp4 && echo "✓ mac 内置 ffmpeg 可转封装"
      - name: 打包 .app(内置 ffmpeg)
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os darwin \
            --name TSMerge --app-id com.example.tsmerge \
            --icon icon.png --executable tsmerge
          cp ffmpeg TSMerge.app/Contents/MacOS/ffmpeg
          cp THIRD-PARTY-ffmpeg.txt TSMerge.app/Contents/Resources/
      - name: 制作 .dmg
        run: |
          mkdir -p dmg-stage
          cp -R TSMerge.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname TSMerge -srcfolder dmg-stage \
            -ov -format UDZO TSMerge-macos-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TSMerge-macos-universal.dmg

  # ---------- Linux:CGO 原生编译,内置 BtbN ffmpeg,注入 tar ----------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 安装 GUI 依赖
        # glfw 3.4 在 Linux 上同时编译 X11 + Wayland 后端,两套 dev 头文件都要
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - name: 取 ffmpeg 并冒烟测试
        run: |
          curl -fL -o ff.tar.xz "${BTBN_BASE}/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir ffdir && tar xJf ff.tar.xz -C ffdir
          cp "$(find ffdir -name ffmpeg -path '*/bin/*' | head -1)" ffmpeg
          chmod +x ffmpeg
          rm -rf ff.tar.xz ffdir   # 清掉下载包,免得后面 *.tar.xz 通配到它
          ./ffmpeg -y -f lavfi -i testsrc=duration=1:size=160x120:rate=10 -f mpegts smoke.ts -loglevel error
          ./ffmpeg -y -i smoke.ts -c copy -movflags +faststart smoke.mp4 -loglevel error
          test -s smoke.mp4 && echo "✓ linux 内置 ffmpeg 可转封装"
      - name: fyne 打包并注入 ffmpeg
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          "$(go env GOPATH)/bin/fyne" package -os linux \
            --name TSMerge --app-id com.example.tsmerge --icon icon.png
          mkdir extract && tar xJf ./*.tar.xz -C extract
          TOP=$(ls extract)
          cp ffmpeg "extract/$TOP/usr/local/bin/ffmpeg"
          cp THIRD-PARTY-ffmpeg.txt "extract/$TOP/"
          tar cJf tsmerge-linux-amd64.tar.xz -C extract "$TOP"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: tsmerge-linux-amd64.tar.xz

  # ---------- 汇总三端产物,创建 Release(仅打标签时)----------
  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出待发布产物
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            TS 视频合并工具 ${{ github.ref_name }} —— 三端均已内置 ffmpeg,开箱即可转 mp4,无需另装。

            | 平台 | 文件 |
            |---|---|
            | Windows 64 位 | `tsmerge-windows-amd64.zip`(解压后双击 tsmerge.exe) |
            | macOS(Intel + Apple Silicon) | `TSMerge-macos-universal.dmg` |
            | Linux 64 位 | `tsmerge-linux-amd64.tar.xz` |

            macOS 未签名,首次打开右键→打开,或 `xattr -cr TSMerge.app`。
            内置 ffmpeg 为 GPL 构建,详见包内 `THIRD-PARTY-ffmpeg.txt`。
